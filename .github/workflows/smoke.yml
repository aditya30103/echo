name: Smoke

# Catches "works on my machine" regressions before merge to master.
#
# Two jobs:
#   test       — editable install (developer's view): full pytest + end-to-end CLI
#                flow against the synthetic Takeout fixtures (init -> ingest ->
#                signals -> detect -> doctor). API-bound steps (enrich, reflect,
#                embed) are skipped — they need keys we don't ship to CI.
#   wheel-smoke — packaged-user's view: builds the wheel, installs it into a CLEAN
#                venv, and boots it from OUTSIDE the repo. This is the only job that
#                catches packaging regressions like api/ living outside the wheel —
#                the `test` job's editable+repo-root install cannot see them.
#
# `python -m echo.cli.main` is used in the `test` job instead of the bare `echo`
# command because bash's built-in `echo` would shadow the installed script. The
# wheel-smoke job calls the script by absolute venv path, so no shadowing applies.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package + dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: CLI sanity (version, help)
        run: |
          python -m echo.cli.main --version
          python -m echo.cli.main --help

      - name: Pytest suite
        run: pytest tests/ -v --tb=short

      - name: End-to-end CLI smoke (init + ingest + signals + detect + doctor)
        env:
          ECHO_DATA_DIR: ${{ runner.temp }}/echo-data
        run: |
          # Materialize the synthetic Takeout fixtures into the workspace.
          python -c "
          from pathlib import Path
          from tests.fixtures import build_activity_zip, build_youtube_zip, build_calendar_zip
          d = Path('.').resolve()
          build_activity_zip(d)
          build_youtube_zip(d)
          build_calendar_zip(d)
          print('Fixtures materialized in', d)
          "

          mkdir -p "$ECHO_DATA_DIR"

          # Configure the install pointing at the freshly-built zips.
          python -m echo.cli.main init --non-interactive \
            --data-dir "$ECHO_DATA_DIR" \
            --activity-zip "$(pwd)/sample-activity.zip" \
            --youtube-zip "$(pwd)/sample-youtube.zip" \
            --calendar-zip "$(pwd)/sample-calendar.zip"

          # Run the API-independent pipeline steps.
          python -m echo.cli.main ingest
          python -m echo.cli.main signals
          python -m echo.cli.main detect --penalty 3.0

          # Diagnostic - prints config + every table count.
          python -m echo.cli.main doctor

          # Assert the pipeline actually produced expected schema.
          python -c "
          import sqlite_utils, os
          db = sqlite_utils.Database(os.environ['ECHO_DATA_DIR'] + '/echo.db')
          tables = {t.name for t in db.tables}
          required = {'watches', 'yt_searches', 'watch_later', 'google_searches',
                      'discover_feed', 'calendar_events', 'transactions',
                      'watch_signals', 'chapters', 'chapter_fingerprints'}
          missing = required - tables
          assert not missing, f'Missing tables after echo run: {missing}'
          assert db['watches'].count == 45, f'Expected 45 watches, got {db[\"watches\"].count}'
          assert db['chapters'].count >= 1, 'PELT produced no chapters'
          print('All schema + row count assertions passed.')
          "

  wheel-smoke:
    # Single Python on purpose: building+installing the wheel is the slow part, and
    # a packaging defect is not Python-version-specific. Keep PR feedback fast; add a
    # matrix only if a version-specific packaging bug ever appears.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build the wheel
        # Uses the committed src/echo/ui/dist (no Node needed here). publish.yml
        # rebuilds the UI from source for real releases; this job only verifies the
        # packaging shape, so the committed bundle is what we want to exercise.
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Install the wheel into a clean venv
        run: |
          python -m venv "$RUNNER_TEMP/smoke-venv"
          "$RUNNER_TEMP/smoke-venv/bin/pip" install --upgrade pip
          "$RUNNER_TEMP/smoke-venv/bin/pip" install dist/*.whl

      - name: Boot from outside the repo (the pip-install user's view)
        # cd to a dir that is NOT the repo root, so the source tree is absent from
        # sys.path. If `echo serve`'s app imports here, the backend genuinely ships
        # inside the wheel. This is the CI half of the 5C packaged-install guard;
        # tests/test_packaged_imports.py is the fast local half.
        run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/smoke-venv/bin/echo" --help
          "$RUNNER_TEMP/smoke-venv/bin/python" - <<'PY'
          import echo.api.main as m
          paths = {getattr(r, "path", None) for r in m.app.routes}
          assert "/api/health" in paths, f"health route missing: {sorted(p for p in paths if p)}"

          # The bundled SvelteKit UI must ship in the wheel too (hatchling
          # force-include of src/echo/ui/dist). echo serve mounts it; a missing
          # bundle would silently serve no frontend.
          from importlib.resources import files
          index = files("echo") / "ui" / "dist" / "index.html"
          assert index.is_file(), "ui/dist/index.html not shipped in the wheel"

          print("WHEEL_BOOT_OK")
          PY
