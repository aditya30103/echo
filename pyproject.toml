[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "echo-archaeology"
version = "0.1.0"
description = "Personal data archaeology — analyze your own YouTube + Spotify + Calendar history locally with an autonomous AI agent."
readme = "README.md"   # rendered as the PyPI project-page long description (text/markdown)
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Aditya Arya" }]
keywords = ["personal-data", "youtube", "spotify", "takeout", "data-analysis", "agent", "claude"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
  # CLI
  "typer>=0.12.0",
  # Pipeline core
  "sqlite-utils>=3.35",
  "python-dotenv>=1.0.0",
  "pyyaml>=6.0",
  "httpx>=0.27.0",
  # Detection + analysis
  "ruptures>=1.1.9",
  "scikit-learn>=1.4.0",
  "scipy>=1.13.0",
  "statsmodels>=0.14.0",
  # External integrations
  "google-api-python-client>=2.130.0",
  "icalendar>=5.0.0",
  "duckduckgo-search>=6.0.0",
  "pylast>=5.0",  # Last.fm SDK for enrich_music_meta (mood/genre tags)
  # Vector store + embeddings.
  # pylance (imports as `lance`) is lancedb's storage backend. lancedb >= 0.33
  # no longer bundles it, and table reads (`tbl.to_pandas()` in clustering /
  # vector_search / embed) raise "lance library is required" without it. Older
  # lancedb (<=0.30) bundled it, which is why a fresh CI install broke while
  # cached dev envs passed. Declare it explicitly so every install gets a backend.
  "lancedb>=0.30.0",
  "pylance>=0.16.0",
  # LLM providers
  "openai>=1.30.0",
  "anthropic>=0.40.0",
  # Observability (optional at runtime; import-guarded in api/observability.py)
  "langfuse>=2.0.0",
  # API + UI server
  "fastapi[all]>=0.111.0",
  "uvicorn[standard]>=0.29.0",
  # Datasette browser (optional but shipped with run.bat / run.sh)
  "datasette>=0.64",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
echo = "echo.cli.main:app"

[project.urls]
Homepage = "https://github.com/aditya30103/echo"
Repository = "https://github.com/aditya30103/echo"
Issues = "https://github.com/aditya30103/echo/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/echo"]
# The bundled SvelteKit UI lives at src/echo/ui/dist (committed; rebuilt from
# source by publish.yml for releases). Because it sits *inside* the package dir,
# `packages = ["src/echo"]` already ships it — hatchling includes non-.py files
# under a package. A force-include mapping it to echo/ui/dist would add the same
# archive path twice and hard-fail the build ("a second file is being added at
# the same path"), so there is deliberately no force-include here.

[tool.hatch.build.targets.sdist]
include = [
  "src/echo",
  "LICENSE",
  "pyproject.toml",
  "CLAUDE.md",
  "AGENTS.md",
  "DATA.md",
  "RUNBOOK.md",
  "SETUP.md",
  "TODOS.md",
  "annotations.example.yaml",
  "metadata.yaml",
  ".env.example",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
